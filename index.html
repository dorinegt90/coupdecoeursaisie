<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coup De Coeur — Suivi des contacts</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= ÉCRAN DE CONNEXION ================= -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4.5c2 0 3.6 1.1 4.4 2.7.8-1.6 2.4-2.7 4.4-2.7C18 4.5 19.6 8 20 11.7 17.5 16.4 12 21 12 21z"/></svg>
      </div>
      <span>Coup De Coeur</span>
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="vous@exemple.fr">
    </div>
    <div class="field" style="margin-bottom:16px;">
      <label>Mot de passe</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn-primary" style="width:100%;justify-content:center;" onclick="handleLogin()">Se connecter</button>
    <p id="login-error" class="hidden" style="color:var(--red);font-size:12px;margin-top:10px;"></p>
  </div>
</div>

<!-- ================= APPLICATION ================= -->
<div id="app-shell" class="hidden">

  <div class="topbar">
    <div class="brand">
      <div class="logo-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4.5c2 0 3.6 1.1 4.4 2.7.8-1.6 2.4-2.7 4.4-2.7C18 4.5 19.6 8 20 11.7 17.5 16.4 12 21 12 21z"/></svg>
      </div>
      <span>Coup De Coeur</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-dashboard" onclick="switchTab('dashboard')">Tableau de bord</button>
      <button class="tab-btn" id="tab-contacts" onclick="switchTab('contacts')">Contacts</button>
      <button class="btn-primary" onclick="openContactForm()">+ Ajouter un contact</button>
      <button class="btn-secondary" onclick="handleLogout()">Déconnexion</button>
    </div>
  </div>

  <!-- ---------------- TABLEAU DE BORD ---------------- -->
  <div id="view-dashboard" class="view">
    <div class="dash-header">
      <span class="dash-period" id="dash-period-label">Semaine complète : —</span>
      <div class="period-toggle">
        <button id="period-week" class="active" onclick="setPeriod('week')">Semaine</button>
        <button id="period-month" onclick="setPeriod('month')">Mois</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card c1"><div class="stat-value" id="stat-nouveaux">—</div><div class="stat-label">Nouveaux contacts</div></div>
      <div class="stat-card c2"><div class="stat-value" id="stat-decouverte">—</div><div class="stat-label">Appels découverte</div></div>
      <div class="stat-card c3"><div class="stat-value" id="stat-signatures">—</div><div class="stat-label">Signatures</div></div>
      <div class="stat-card c4"><div class="stat-value" id="stat-ca">—</div><div class="stat-label">Chiffre d'affaires</div></div>
    </div>
    <div class="recent-list-title">Derniers contacts</div>
    <div id="recent-contacts-list"></div>
  </div>

  <!-- ---------------- CONTACTS ---------------- -->
  <div id="view-contacts" class="view hidden">
    <div class="contacts-toolbar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Rechercher un nom, un email..." oninput="renderContactsTable()">
      </div>
      <select class="filter-select" id="filter-statut" onchange="renderContactsTable()">
        <option value="">Statut : Tous</option>
        <option value="Contact entrant">Contact entrant</option>
        <option value="Appel découverte programmé">Appel découverte programmé</option>
        <option value="Prospect">Prospect</option>
        <option value="Adhérent">Adhérent</option>
        <option value="Perdu">Perdu</option>
      </select>
    </div>
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th><th>Nom</th><th>Prénom</th><th>Âge</th><th>Email</th>
            <th>Téléphone</th><th>Adresse</th><th>CP</th><th>Ville</th>
            <th>Type de contact</th><th>Commentaire</th><th>Statut</th><th>Formule</th>
          </tr>
        </thead>
        <tbody id="contacts-table-body"></tbody>
      </table>
    </div>
    <div class="table-footer" id="contacts-count"></div>
  </div>

</div>

<!-- ================= MODALE : AJOUT / MODIFICATION D'UN CONTACT ================= -->
<div id="modal-contact-form" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title"><span id="form-title">Nouveau contact</span></div>
      <button class="icon-btn" onclick="closeContactForm()">✕</button>
    </div>
    <input type="hidden" id="form-contact-id">
    <div class="form-grid grid-3">
      <div class="field"><label>Date</label><input type="date" id="f-date"></div>
      <div class="field"><label>Nom</label><input type="text" id="f-nom"></div>
      <div class="field"><label>Prénom</label><input type="text" id="f-prenom"></div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 2fr 2fr;">
      <div class="field"><label>Âge</label><input type="number" id="f-age" min="18" max="120"></div>
      <div class="field"><label>Email</label><input type="email" id="f-email"></div>
      <div class="field"><label>Téléphone</label><input type="tel" id="f-telephone"></div>
    </div>
    <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr;">
      <div class="field"><label>Adresse</label><input type="text" id="f-adresse"></div>
      <div class="field"><label>Code postal</label><input type="text" id="f-cp"></div>
      <div class="field"><label>Ville</label><input type="text" id="f-ville"></div>
    </div>
    <div class="form-grid grid-2">
      <div class="field">
        <label>Connu par</label>
        <select id="f-connu-par">
          <option>Recherche Google</option><option>Pub Google</option><option>Pub Facebook</option>
          <option>Journal</option><option>Radio</option><option>Recommandation</option><option>Autre</option>
        </select>
      </div>
      <div class="field">
        <label>Type de contact</label>
        <select id="f-type-contact">
          <option>Appel entrant</option><option>Mail</option><option>Whatsapp</option>
          <option>SMS</option><option>Facebook</option><option>Autre</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>Commentaire</label>
      <textarea id="f-commentaire" placeholder="Notes libres sur ce contact..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeContactForm()">Annuler</button>
      <button class="btn-primary" onclick="saveContactForm()">✓ Enregistrer le contact</button>
    </div>
  </div>
</div>

<!-- ================= MODALE : FICHE DÉTAIL D'UN CONTACT ================= -->
<div id="modal-contact-detail" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:680px;">
    <div class="modal-header">
      <div class="modal-title">
        <div class="avatar" id="detail-avatar" style="width:34px;height:34px;font-size:13px;">--</div>
        <span id="detail-name">—</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-secondary" onclick="toggleEditMode()" id="detail-edit-btn">Modifier</button>
        <button class="icon-btn" onclick="closeContactDetail()">✕</button>
      </div>
    </div>

    <div class="detail-section-title">Informations</div>
    <div id="detail-view-fields" class="detail-grid"></div>
    <div id="detail-edit-fields" class="hidden"></div>

    <div class="detail-section-title">Statut</div>
    <div class="status-row">
      <span id="detail-current-badge" class="badge">—</span>
    </div>
    <div class="form-grid grid-2" style="margin-bottom:8px;">
      <div class="field">
        <label>Nouveau statut</label>
        <select id="detail-new-status" onchange="onDetailStatusChange()">
          <option value="Contact entrant">Contact entrant</option>
          <option value="Appel découverte programmé">Appel découverte programmé</option>
          <option value="Prospect">Prospect</option>
          <option value="Adhérent">Adhérent</option>
          <option value="Perdu">Perdu</option>
        </select>
      </div>
      <div class="field"><label>Note (optionnel)</label><input type="text" id="detail-status-note"></div>
    </div>

    <div id="detail-adhesion-fields" class="hidden">
      <div class="form-grid grid-2">
        <div class="field"><label>Formule</label><input type="text" id="detail-formule" list="formules-list"></div>
        <div class="field"><label>Montant (€)</label><input type="number" id="detail-montant" step="0.01"></div>
      </div>
      <div class="form-grid grid-2">
        <div class="field">
          <label>Mode de règlement</label>
          <select id="detail-mode-reglement">
            <option>Carte bancaire</option><option>Chèque</option><option>Virement</option>
            <option>Espèces</option><option>Prélèvement</option>
          </select>
        </div>
        <div class="field"><label>En combien de fois</label><input type="number" id="detail-nb-fois" min="1" value="1"></div>
      </div>
      <datalist id="formules-list"><option value="Essentiel"><option value="Premium"><option value="Sur-mesure"></datalist>
    </div>

    <div class="form-actions">
      <button class="btn-primary" onclick="saveStatusChange()">Enregistrer le statut</button>
    </div>

    <div class="detail-section-title">Historique</div>
    <div id="detail-history-list"><div class="empty-state">Aucun historique</div></div>

    <div class="form-actions" style="margin-top:18px;">
      <button class="btn-danger" onclick="deleteCurrentContact()">Supprimer ce contact</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
